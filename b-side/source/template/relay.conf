# ommega-b relay (B-side) configuration.
#
# This file is copied to /data/adb/ommega-b/conf/relay.conf on first install and read by
# the relay service (template/service.sh).  Each line is KEY=VALUE;
# lines starting with '#' are treated as comments.  Values must not contain
# spaces (trailing/leading spaces are stripped).
#
# The relay daemon is the "new B-side" agent: it long-polls the relay_server
# (ommega-old) for tasks, mints real-TEE attestation chains with the A-side
# supplied appid (tag 709), and posts results back.  See src/bin/relay.rs.

# Base URL of the relay_server.  Both http:// and https:// are supported.
# Official online service default (README "瀹樻柟鍦ㄧ嚎鏈嶅姟"): http://110.40.170.96:10886
OMMEGA_RELAY_SERVER=http://110.40.170.96:10886

# Device id as registered on the relay_server (B-side, REQUIRED).
# On first install this value is replaced by a random id (device-b-<8 hex>)
# by post-fs-data.sh, so each device registers uniquely; edit it here if you
# want a fixed id instead.  It MUST match the A-side config's `device_id` key
# so tasks routed to that id are picked up by this B-side agent.
OMMEGA_RELAY_DEVICE_ID=device-b-<random>

# Machine id used in the b/poll query.  On first install post-fs-data.sh fills
# this with the current device model (getprop ro.product.model) so the server
# status page shows which model is serving tasks.
OMMEGA_RELAY_MACHINE_ID=<device-model>

# Relay B-side token (sent as X-Relay-Token, REQUIRED by the relay client).
# Official online service B-side default (README): Mytju8b0_lhLlqTKcEUhuwSbAsAtjom0
OMMEGA_RELAY_TOKEN=Mytju8b0_lhLlqTKcEUhuwSbAsAtjom0

# OMMEGA_RELAY_ENABLED: the "allow remote control" master switch (WebUI:
# 杩滄帶 / 鍏佽杩滄帶).  1/true/yes/on keeps the relay running; anything else leaves
# the relay stopped -- no long poll, no tasks, the device is simply not on the
# server.  Missing key means ON, so an old config is never silently disabled by
# a module upgrade.  The supervisor re-reads this every 2 seconds, so flipping
# it in the WebUI takes effect without a reboot.  (The relay binary itself does
# not know this key; template/service.sh decides whether to spawn it at all.)
OMMEGA_RELAY_ENABLED=true

# OMMEGA_RELAY_ABDR_ENABLED: the "allow adbr remote control" switch (WebUI:
# 鍏佽 adbr 杩滄帶).  adbr is a second, separate channel: the device dials out to
# our own server and that server can then run commands / transfer files / open
# an adb tunnel.  It is NOT needed for attestation forwarding -- it exists only
# for when the phone is in someone else's hands and you cannot reach it.  A
# device should not sit reachable around the clock, so this defaults to OFF and
# is never enabled by the installer: you have to tick it yourself.
# Missing key means OFF.
OMMEGA_RELAY_ABDR_ENABLED=false

# Logging control (all sinks are managed here in one place).
# OMMEGA_RELAY_LOG_ENABLED: write /data/adb/ommega-b/logs/relay.log?
#   true=on (default), false=off.
# OMMEGA_RELAY_LOG_LEVEL: file log level.
#   off|error|warn|info|debug|trace (default info).
# OMMEGA_RELAY_LOGCAT_ENABLED: Android logcat output (tag ommega-b)?
#   true=on (default), false=fully silent.
# OMMEGA_RELAY_LOGCAT_LEVEL: logcat level.
#   off|error|warn|info|debug|trace (default info).
# These are read at relay startup (they are NOT hot-reloaded); after changing
# them, restart the relay via `touch /data/adb/ommega-b/run/restart.all` or reboot.
OMMEGA_RELAY_LOG_ENABLED=true
OMMEGA_RELAY_LOG_LEVEL=debug
OMMEGA_RELAY_LOGCAT_ENABLED=true
OMMEGA_RELAY_LOGCAT_LEVEL=info

# OMMEGA_RELAY_BIND_IFACE: which interface relay traffic leaves from.
#   none   (default) never bind -- the OS picks, and can switch WiFi/cellular
#          on its own when one of them dies.
#   auto   bind to a physical uplink only while a VPN is up.  A VPN steers
#          ordinary traffic into its tunnel (slow, jittery, and sometimes simply
#          unreachable); naming the outgoing device is the only way to keep a
#          socket out of it.  Costs the OS's own network switching.
#   always always bind to a physical uplink.
#   <name> a literal interface name (e.g. wlan0), taken at face value.
# With more than one physical uplink holding an IPv4 address the candidates are
# raced against the relay's own /api/ping/ and the first to answer wins; the
# losers only ever send a harmless GET.  Nothing that answers is a tunnel: the
# vendor tunnel names (vgate*, ovnet*, wondertap*) are excluded by name.
# NOTE on this device: relay traffic already leaves through wlan0 (`ip rule`
# sends every local process into `table wlan0`), so binding buys nothing today
# and would drop the WiFi->cellular fallback.  Leave it at none unless the
# routing really does send relay traffic into a tunnel.
OMMEGA_RELAY_BIND_IFACE=auto

# OMMEGA_RELAY_PATH_PROBE: hit the relay's /api/ping/ before each long poll
# (result cached 10s; 1s after a failure) and skip the long poll when nothing
# answers.  A dead link cannot be helped by a 15s long poll -- it only burns the
# short windows where the device is awake.  Costs one tiny request every 10s.
OMMEGA_RELAY_PATH_PROBE=true

# OMMEGA_RELAY_WAKELOCK: hold a wake lock so the system does not suspend.
# ON BY DEFAULT -- a suspended relay is a dead relay.  Android suspends as soon as
# nothing holds a wake lock, and while suspended reqwest's timeouts (monotonic
# clock) do not advance, so the first poll after a resume hangs until something
# else wakes the device; the server marks this device offline after 120s of
# silence and other B devices start serving its requests.  Holding
# /sys/power/wake_lock keeps the CPU (and the poll loop) alive.
# Set to false if you would rather save battery and let the system sleep -- the
# relay then only recovers after the device happens to wake up.
# Kernels without CONFIG_PM_WAKELOCKS have no such file; the relay skips it
# quietly.
# NOTE: this lock is NOT tied to the process -- it survives the relay dying, so
# the relay clears a stale lock of the same name on start, releases it on exit,
# and the uninstall hook releases it too.
OMMEGA_RELAY_WAKELOCK=true

# OMMEGA_RELAY_PATCHLEVEL_FOLLOW_A: 让本机真 TEE 按 A 端声明的补丁日期出链。
# OFF by default -- 开了以后，一笔认证可能要多等两三秒（改属性 + 弹一次 keymint HAL
# 让它重读，只在该值变动时发生），而且这台设备的补丁日期会跟着请求方走。
# 1/true/yes/on = on.
OMMEGA_RELAY_PATCHLEVEL_FOLLOW_A=false

# OMMEGA_RELAY_PATCHLEVEL_METHOD: 用哪种办法把日期落下去（只在上面那个跟随开关
# 打开时才看）。
#   prop（默认）= 改系统属性 + 让 keymint HAL 重读，任何机器都能用，一笔慢两三秒；
#   live        = 直接改 KeyMint TA 的 attestation 配置（国产高通那套 KeymasterUtils
#                 通道），不弹 HAL、不重启 keystore2，签完立刻回基线，只在一部分
#                 机型上可用。这个值写错/写不认识的一律按 prop 走。
# live 起不来（没有 spl_daemon、不是这类机器、daemon 没权限）时，这一笔会自动退回
# prop，不会因为选错方法而把链弄错。
OMMEGA_RELAY_PATCHLEVEL_METHOD=prop

# OMMEGA_RELAY_PATCHLEVEL_SKIP_PKGS: 黑名单，逗号分隔。命中的请求**不**跟随 ——
# 不改属性、不弹 HAL，直接拿本机现在的值出链。留空 = 全都跟。
# 匹配的是 tag 709 里的包名，所以一个 App 就算换了签名/版本也还是同一项。
# 默认拉黑：QQ / 微信 / 以及一批检测类 App（MT 管理器、KernelSU、密钥认证、
# 春秋、TrustAttestor、Duck Detector）。QQ 实测是流量和日期最杂的那个（5 分钟
# 16 笔、声明过 6 种不同日期），不拉黑的话每笔都把本机日期翻一次。
OMMEGA_RELAY_PATCHLEVEL_SKIP_PKGS=com.tencent.mobileqq,com.tencent.mm,bin.mt.plus,me.weishu.kernelsu,io.github.vvb2060.keyattestation,wu.keyChain.test,com.chunqiunativecheck,com.lingqing.trustattestor,com.eltavine.duckdetector,com.studio.duckdetector

# OMMEGA_RELAY_SOTER_MUTATION: allow the SOTER ops that create/remove device
# keys (generate_*/remove_*).  1/true/yes/on = on, anything else = off.
#
# ON by default on purpose: a B-side relay answers for the A-side apps, and a
# real app only finishes its SOTER setup when the device can mint the material
# it asks for.  With this off every `generate_*` is refused locally, the app
# sees the same -5 as "this key is not on this device" and loops (build AuthKey
# -> export -> remove -> retry) forever -- measured 2026-10-06 on PLC110, where
# a stale config kept it off for a whole day.  Set it to 0 if this device must
# never write SOTER key state.
OMMEGA_RELAY_SOTER_MUTATION=1
#
# OMMEGA_RELAY_SOTER_CONCURRENCY: how many SOTER HAL calls may be in flight at
# once (default 2, clamped to 1..4).  The ops of ONE uid are always serialised --
# interleaving an export with a rebuild on the same uid is what leaves a half
# built slot behind and feeds the TA -5.  Different uids may run in parallel.
# Kept low on purpose: the TA's RPMB session is exclusive, and the slots we do
# not take are the ones the device itself (system / a real WeChat on the phone)
# can still use.  The wedge detector + auto reboot from hal_restart stays as the
# backstop.  This value is re-read from the live config, so it takes effect
# without reinstalling the module.
OMMEGA_RELAY_SOTER_CONCURRENCY=2
#
# OMMEGA_RELAY_SOTER_PROBE_UID / OMMEGA_RELAY_SOTER_PROBE_ALIAS: slot to try a
# real signature on when advertising capabilities.  Whether this device can sign
# at all can only be measured, never guessed -- and the only honest verdict is
# the positive one: 2026-10-06 measured on PLC110 that a headless relay really
# does sign (nobody pressed a fingerprint; the signature verifies against the
# AuthKey public key), so a failure code is never evidence that the device
# cannot sign.  With a slot that already exists on the device the relay really
# signs once and advertises `soter_sign` only if that worked.  Both keys are
# needed; neither creates or removes anything.
#
