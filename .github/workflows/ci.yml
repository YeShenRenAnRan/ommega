# 三端的代码门禁：clippy、格式、编译/跑测试。
#
# 为什么 A/B 端只编不跑测试：这两个 crate 只能编到 aarch64 目标（b-side 依赖的
# rsproperties 只对 Linux/Android 生效，裸 cargo check 必挂，看着像代码坏了），
# 测试二进制也只能编、不能在 CI 里执行 —— 真机那一层留给人，见
# a-side/source/AGENTS.md 的 Validation and Deployment。server 是 host 目标，
# 测试能真跑，所以它跑 cargo test。
#
# clippy 带 -D warnings：三端的警告已经清干净了，带上才拦得住回潮。
# 本地那道 pre-commit 钩子只查格式（脚本在仓库根的 .cargo-husky/hooks/）。
#
# 除了门禁，最后那条 `package` job 负责出 B 端的模块包（刷入用的 zip）：
# push 到 master 出 artifact，打 `v*` tag 时再顺手发 Release。
name: ci

on:
  push:
    branches: [master]
    # 打 tag 也要触发：`branches` 过滤器只认分支，光写 master 的话 tag push
    # 一次都不会跑，package 里那段发 Release 的步骤就永远轮不到。
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: a-side
            ws: a-side/source
            target: aarch64-linux-android
          - name: b-side
            ws: b-side/source
            target: aarch64-linux-android
          - name: server
            ws: server/source
            target: ""
    env:
      ANDROID_NDK_ROOT: /home/runner/android-ndk-r27d
    steps:
      - uses: actions/checkout@v4

      - name: 装工具链
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal --no-self-update \
            --component clippy --component rustfmt
          rustup default stable
          # minimal profile 不含 Android target，要单独装；缺了会报
          # `can't find crate for core`。
          if [ -n "${{ matrix.target }}" ]; then
            rustup target add "${{ matrix.target }}"
          fi

      # a-side 的 build.rs 用 prost 把 proto/storage.proto 编译成 Rust 代码，
      # 得有 protoc 在手边（prost-build 0.11 起不再自带）。
      - name: 装 protoc
        if: matrix.name == 'a-side'
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends protobuf-compiler
          protoc --version

      # injector 用 include_bytes! 把本地兜底 ASK 私钥编进二进制，而 `*.pem` 被仓库根的
      # .gitignore 排除（私钥不能进公开仓库），所以干净 checkout 里根本没有这个文件，
      # 编译直接断在 `couldn't read .../assets/soter_ask.pem`。这里现生成一把**编译占位**，
      # 只为让 clippy/fmt 过得去：CI 不打包，它不会出现在任何发布产物里，
      # 更不是服务端认的那把 ASK。
      - name: 生成编译用的占位 ASK
        if: matrix.name == 'a-side'
        working-directory: ${{ matrix.ws }}
        run: |
          set -euo pipefail
          mkdir -p ommega-injector/assets
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 \
            -out ommega-injector/assets/soter_ask.pem
          openssl pkey -in ommega-injector/assets/soter_ask.pem -noout -check

      - name: 取 NDK 缓存
        if: matrix.target != ''
        id: ndk
        uses: actions/cache@v4
        with:
          path: /home/runner/android-ndk-r27d
          key: android-ndk-r27d-linux

      - name: 下 NDK r27d
        if: matrix.target != '' && steps.ndk.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          curl -sSfL --retry 3 --max-time 900 -o /tmp/ndk.zip \
            https://dl.google.com/android/repository/android-ndk-r27d-linux.zip
          unzip -q /tmp/ndk.zip -d /home/runner
          rm -f /tmp/ndk.zip
          test -x "$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/clang"

      - name: 生成 .cargo/config.toml
        if: matrix.target != ''
        working-directory: ${{ matrix.ws }}
        run: python3 scripts/setup_cargo_config.py

      - name: 取 cargo 缓存
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ matrix.ws }}/target
          key: cargo-${{ runner.os }}-${{ matrix.name }}-${{ hashFiles(format('{0}/Cargo.lock', matrix.ws)) }}
          restore-keys: |
            cargo-${{ runner.os }}-${{ matrix.name }}-

      - name: clippy
        working-directory: ${{ matrix.ws }}
        run: |
          set -euo pipefail
          if [ -n "${{ matrix.target }}" ]; then
            cargo clippy --target "${{ matrix.target }}" --workspace --all-targets -- -D warnings
          else
            cargo clippy --workspace --all-targets -- -D warnings
          fi

      # 必须排在 clippy 后面：a-side 的 build.rs 会把 proto/storage.proto 生成到
      # src/proto/，而那里被 src/.gitignore 排除、不进仓库 —— rustfmt 解析
      # `pub mod proto;` 时要那两个文件在场，否则直接
      # "failed to resolve mod `proto`"。clippy 编过一遍之后文件就在了。
      - name: cargo fmt --check
        working-directory: ${{ matrix.ws }}
        run: cargo fmt --all -- --check

      - name: 测试
        working-directory: ${{ matrix.ws }}
        run: |
          set -euo pipefail
          if [ -n "${{ matrix.target }}" ]; then
            # 只编不跑：测试二进制要在真机 aarch64 上执行，CI 里没有设备。
            cargo test --target "${{ matrix.target }}" --workspace --no-run
          else
            cargo test --workspace
          fi

  # B 端模块包（Magisk/KernelSU 刷入用的 zip）。
  #
  # 为什么不写 `needs: gate`：gate 矩阵里 a-side（clippy）和 server（测试）在上游
  # 就是红的，挂上去等于永远轮不到出包。b-side 自己的门禁在 gate 里已经单独跑了，
  # 而且这里出包之前要再编一遍 release，编不过照样红 —— 兜底没丢。
  #
  # pull_request 不跑：出包是给装机用的，PR 上白编一遍 release 没意义。
  package:
    name: package (b-side 模块包)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      # 打 tag 那一步要发 Release，只有这条 job 需要写权限。
      contents: write
    env:
      ANDROID_NDK_ROOT: /home/runner/android-ndk-r27d
    steps:
      - uses: actions/checkout@v4

      # 只用 stable：AGENTS.md 里「必须 nightly（OnceCell::get_or_try_init）」
      # 那句已经过时了，那个调用全仓搜不到，stable 编得过。
      - name: 装工具链
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          rustup target add aarch64-linux-android

      # 和 gate 共用同一把缓存 key：两条腿谁先跑谁把 NDK 存进去，另一条直接命中。
      - name: 取 NDK 缓存
        id: ndk
        uses: actions/cache@v4
        with:
          path: /home/runner/android-ndk-r27d
          key: android-ndk-r27d-linux

      - name: 下 NDK r27d
        if: steps.ndk.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          curl -sSfL --retry 3 --max-time 900 -o /tmp/ndk.zip \
            https://dl.google.com/android/repository/android-ndk-r27d-linux.zip
          unzip -q /tmp/ndk.zip -d /home/runner
          rm -f /tmp/ndk.zip
          test -x "$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/clang"

      - name: 生成 .cargo/config.toml
        working-directory: b-side/source
        run: python3 scripts/setup_cargo_config.py

      - name: 取 cargo 缓存
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            b-side/source/target
          key: cargo-${{ runner.os }}-package-${{ hashFiles('b-side/source/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-package-

      - name: 打包
        working-directory: b-side/source
        run: python3 build.py --release --abi arm64-v8a

      # 包出来了不等于里面的东西对：直接盯 release 二进制里的 HAL 名，确认
      # HIDL 后端真的编进去了（没有 AIDL KeyMint 的机器全靠它）。
      - name: 校验包内容
        working-directory: b-side/source
        run: |
          set -euo pipefail
          relay=target/aarch64-linux-android/release/relay
          for needle in \
            'android.hardware.keymaster@4.1::IKeymasterDevice' \
            'android.hardware.keymaster@4.0::IKeymasterDevice'
          do
            grep -qa "$needle" "$relay" || {
              echo "::error::relay 里找不到 $needle —— HIDL 后端没进包"
              exit 1
            }
            echo "OK  $needle"
          done

          zip=$(ls target/ommega-b-release-*.zip)
          unzip -l "$zip"
          {
            echo "### B 端模块包"
            echo
            echo '```'
            sha256sum "$zip"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: ommega-b-module
          path: b-side/source/target/ommega-b-release-*.zip
          if-no-files-found: error
          retention-days: 30

      - name: 打 tag 时发 Release
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: b-side/source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC2046  # 通配符要展开成多个附件参数
          gh release create "$GITHUB_REF_NAME" \
            $(ls target/ommega-b-release-*.zip) \
            --title "ommega-b $GITHUB_REF_NAME" \
            --notes "B 端模块包（arm64-v8a，release 构建）。刷入方式见 README。" \
            --verify-tag
