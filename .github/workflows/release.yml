# 发版：编三端产物并挂到 GitHub Release 上。
#
# 为什么 A 端要拿 secret 里的 ASK：injector 用 `include_bytes!` 把本地兜底 SOTER 私钥
# 编进二进制，而 `*.pem` 被 .gitignore 排除（私钥不进公开仓库）。CI 里只能用占位密钥
# 让编译过，但**占位不能进发布包** —— 那会把用户设备上的兜底 ASK 换成一把没人认的钥匙。
# 所以这里从 `secrets.SOTER_ASK_PEM`（base64）还原真实 PEM 再打包。
#
# 手动触发：
#   gh workflow run release.yml -f tag=v1.7.8
# 或 Actions 页面点 Run workflow。
name: release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "要挂产物的 release tag（必须已存在，比如 v1.7.8）"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: a-side
            ws: a-side/source
          - name: b-side
            ws: b-side/source
    env:
      ANDROID_NDK_ROOT: /home/runner/android-ndk-r27d
    steps:
      - uses: actions/checkout@v4

      - name: 装工具链
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android

      - name: 装 protoc
        if: matrix.name == 'a-side'
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends protobuf-compiler
          protoc --version

      # 真实 ASK（base64）→ ommega-injector/assets/soter_ask.pem。
      # 缺 secret 就直接失败，不静默用占位。
      - name: 还原真实 ASK
        if: matrix.name == 'a-side'
        working-directory: ${{ matrix.ws }}
        env:
          SOTER_ASK_PEM_B64: ${{ secrets.SOTER_ASK_PEM }}
        run: |
          set -euo pipefail
          if [ -z "${SOTER_ASK_PEM_B64:-}" ]; then
            echo "缺少 secret SOTER_ASK_PEM（base64 后的 soter_ask.pem）" >&2
            exit 1
          fi
          mkdir -p ommega-injector/assets
          printf '%s' "$SOTER_ASK_PEM_B64" | base64 -d > ommega-injector/assets/soter_ask.pem
          openssl pkey -in ommega-injector/assets/soter_ask.pem -noout -check

      - name: 取 NDK 缓存
        id: ndk
        uses: actions/cache@v4
        with:
          path: /home/runner/android-ndk-r27d
          key: android-ndk-r27d-linux

      - name: 下 NDK r27d
        if: steps.ndk.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          curl -sSfL --retry 3 --max-time 900 -o /tmp/ndk.zip \
            https://dl.google.com/android/repository/android-ndk-r27d-linux.zip
          unzip -q /tmp/ndk.zip -d /home/runner
          rm -f /tmp/ndk.zip

      - name: 生成 .cargo/config.toml
        working-directory: ${{ matrix.ws }}
        run: python3 scripts/setup_cargo_config.py

      - name: 取 cargo 缓存
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ matrix.ws }}/target
          key: cargo-rel-${{ runner.os }}-${{ matrix.name }}-${{ hashFiles(format('{0}/Cargo.lock', matrix.ws)) }}
          restore-keys: |
            cargo-rel-${{ runner.os }}-${{ matrix.name }}-

      - name: 打包
        working-directory: ${{ matrix.ws }}
        run: python3 build.py --release

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}-zip
          path: ${{ matrix.ws }}/target/ommega-*-release-*.zip

  server:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: 装工具链
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          rustup target add x86_64-unknown-linux-musl
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends musl-tools
      - name: 编 musl
        working-directory: server/source
        run: cargo build --release --target x86_64-unknown-linux-musl
      - uses: actions/upload-artifact@v4
        with:
          name: server-bin
          path: server/source/target/x86_64-unknown-linux-musl/release/relay_rs

  publish:
    needs: [build, server]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: 列一下产物
        run: find dist -type f | sort

      # 用 gh 直接把附件挂到已有 release 上（同名附件会被替换）。
      - name: 上传到 release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          for f in dist/a-side-zip/*.zip; do
            [ -f "$f" ] || continue
            gh release upload "$TAG" "$f" --clobber
          done
          for f in dist/b-side-zip/*.zip; do
            [ -f "$f" ] || continue
            gh release upload "$TAG" "$f" --clobber
          done
          gh release upload "$TAG" dist/server-bin/relay_rs --clobber
